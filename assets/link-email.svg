<svg xmlns="http://www.w3.org/2000/svg" width="333" height="72" viewBox="0 0 333 72" font-family="ui-monospace,'JetBrains Mono',SFMono-Regular,Menlo,Consolas,monospace">
  <defs>
    <filter id="tick" filterUnits="userSpaceOnUse" x="-100" y="-100" width="1200" height="1000">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="1" result="n">
        <animate attributeName="seed" values="1;7;13;21" dur="0.5s" calcMode="discrete" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3"/>
    </filter>
    <clipPath id="clip-l-email"><rect x="5" y="5" width="323" height="62" rx="9"/></clipPath>
    <pattern id="dots-l-email" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="1" fill="#f4f4f1" fill-opacity=".08"/></pattern>
    <mask id="notch-l-email"><rect x="-10" y="-10" width="353" height="92" fill="#fff"/><rect x="36" y="65" width="22" height="10" fill="#000"/></mask>
  </defs>
  <style>
    .draw  { stroke-dasharray:1; animation:draw 2.8s cubic-bezier(.16,1,.3,1) .15s backwards; }
    .cur   { animation:blink 1.1s steps(1) infinite; }
    .type  { animation:type 2.4s steps(40) .8s backwards; }
    @keyframes draw   { from{stroke-dashoffset:1} }
    @keyframes blink  { 50%{opacity:0} }
    @keyframes type   { from{clip-path:inset(0 100% 0 0)} }
    .tw    { animation:tw 3.4s ease-in-out infinite; }
    .drift { transform-box:fill-box; transform-origin:center; animation:drift 16s ease-in-out infinite alternate; }
    .fade  { animation:fade .7s cubic-bezier(.16,1,.3,1) backwards; }
    @keyframes tw     { 50%{opacity:.12} }
    @keyframes drift  { to{transform:scale(1.09) translate(-1.5%,-1%)} }
    @keyframes fade   { from{opacity:0} }
    @media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
  </style>
  <rect x="5" y="5" width="323" height="62" rx="9" fill="#08080a"/>
