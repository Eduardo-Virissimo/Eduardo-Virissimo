<svg xmlns="http://www.w3.org/2000/svg" width="490" height="150" viewBox="0 0 490 150" font-family="ui-monospace,'JetBrains Mono',SFMono-Regular,Menlo,Consolas,monospace">
  <defs>
    <filter id="tick" filterUnits="userSpaceOnUse" x="-100" y="-100" width="1200" height="1000">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="1" result="n">
        <animate attributeName="seed" values="1;7;13;21" dur="0.5s" calcMode="discrete" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4"/>
    </filter>
    <clipPath id="clip-c-linkedin"><rect x="5" y="5" width="480" height="140" rx="23"/></clipPath>
    <pattern id="dots-c-linkedin" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="1.1" fill="#f4f4f1" fill-opacity=".09"/></pattern>
    <mask id="notch-c-linkedin"><rect x="-10" y="-10" width="510" height="170" fill="#fff"/><rect x="414" y="-4" width="28" height="12" fill="#000"/></mask>
  </defs>
  <style>
    .draw  { stroke-dasharray:1; animation:draw 2.8s cubic-bezier(.16,1,.3,1) .15s backwards; }
    .cur   { animation:blink 1.1s steps(1) infinite; }
    .type  { animation:type 2.4s steps(40) .8s backwards; }
    @keyframes draw   { from{stroke-dashoffset:1} }
    @keyframes blink  { 50%{opacity:0} }
    @keyframes type   { from{clip-path:inset(0 100% 0 0)} }
    @media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
  </style>
