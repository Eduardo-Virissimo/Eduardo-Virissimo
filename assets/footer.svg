<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="150" viewBox="0 0 1000 150" font-family="ui-monospace,'JetBrains Mono',SFMono-Regular,Menlo,Consolas,monospace">
  <defs>
    <filter id="tick" filterUnits="userSpaceOnUse" x="-100" y="-100" width="1200" height="1000">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="1" result="n">
        <animate attributeName="seed" values="1;7;13;21" dur="0.5s" calcMode="discrete" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4"/>
    </filter>
    <clipPath id="clip-ft"><rect x="5" y="5" width="990" height="140" rx="23"/></clipPath>
    <pattern id="dots-ft" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="1.1" fill="#f4f4f1" fill-opacity=".09"/></pattern>
    <mask id="notch-ft"><rect x="-10" y="-10" width="1020" height="170" fill="#fff"/><rect x="48" y="142" width="28" height="12" fill="#000"/></mask>
  </defs>
  <style>
    .draw  { stroke-dasharray:1; animation:draw 2.8s cubic-bezier(.16,1,.3,1) .15s backwards; }
    .cur   { animation:blink 1.1s steps(1) infinite; }
    .type  { animation:type 2.4s steps(40) .8s backwards; }
    @keyframes draw   { from{stroke-dashoffset:1} }
    @keyframes blink  { 50%{opacity:0} }
    @keyframes type   { from{clip-path:inset(0 100% 0 0)} }
    @media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
  </style>
  <rect x="5" y="5" width="990" height="140" rx="23" fill="#08080a"/>
  <rect width="1000" height="150" fill="url(#dots-ft)" clip-path="url(#clip-ft)"/>
  <g filter="url(#tick)"><rect x="5" y="5" width="990" height="140" rx="23" fill="none" stroke="#f4f4f1" stroke-width="3" mask="url(#notch-ft)"/></g>
  <g filter="url(#tick)"><g transform="translate(466 41) scale(0.6800)" fill="none" stroke="#f4f4f1" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 10 L83 10 Q90 10 90 17 L90 83 Q90 90 83 90 L17 90 Q10 90 10 83 L10 32 Q10 25 17 25 L68 25 Q75 25 75 32 L75 68 Q75 75 68 75 L32 75 Q25 75 25 68 L25 47 Q25 40 32 40 L53 40 Q60 40 60 47 L60 53 Q60 60 53 60 L40 60"/><circle cx="40" cy="60" r="5.8" fill="#c2ebd0" stroke="none"/></g></g>
  <text x="80" y="80" fill="#8e8e89" font-size="13" letter-spacing="4">THANKS FOR STOPPING BY</text>
  <text x="920" y="80" text-anchor="end" fill="#8e8e89" font-size="13" letter-spacing="4">KEEP LOOPING <tspan fill="#c2ebd0">✦</tspan></text>
</svg>
