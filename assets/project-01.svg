<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="140" viewBox="0 0 1000 140" font-family="ui-monospace,'JetBrains Mono',SFMono-Regular,Menlo,Consolas,monospace">
  <defs>
    <filter id="tick" filterUnits="userSpaceOnUse" x="-100" y="-100" width="1200" height="1000">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="1" result="n">
        <animate attributeName="seed" values="1;7;13;21" dur="0.5s" calcMode="discrete" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4"/>
    </filter>
    <clipPath id="clip-p01"><rect x="5" y="5" width="990" height="130" rx="23"/></clipPath>
    <pattern id="dots-p01" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="1.1" fill="#f4f4f1" fill-opacity=".09"/></pattern>
    <mask id="notch-p01"><rect x="-10" y="-10" width="1020" height="160" fill="#fff"/><rect x="924" y="-4" width="28" height="12" fill="#000"/></mask>
  </defs>
  <style>
    .draw  { stroke-dasharray:1; animation:draw 2.8s cubic-bezier(.16,1,.3,1) .15s backwards; }
    .cur   { animation:blink 1.1s steps(1) infinite; }
    .type  { animation:type 2.4s steps(40) .8s backwards; }
    @keyframes draw   { from{stroke-dashoffset:1} }
    @keyframes blink  { 50%{opacity:0} }
    @keyframes type   { from{clip-path:inset(0 100% 0 0)} }
    @media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
  </style>
  <rect x="5" y="5" width="990" height="130" rx="23" fill="#08080a"/>
  <rect width="1000" height="140" fill="url(#dots-p01)" clip-path="url(#clip-p01)"/>
  <g filter="url(#tick)"><rect x="5" y="5" width="990" height="130" rx="23" fill="none" stroke="#f4f4f1" stroke-width="3" mask="url(#notch-p01)"/></g>
  <text x="44" y="52" fill="#8e8e89" font-size="13">Eduardo-Virissimo/vanish</text>
